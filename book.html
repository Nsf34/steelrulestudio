<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book a call | Steel Rule Studio</title>
<style>
  :root{--ink:#131c30;--soft:#4c576f;--cream:#faf7f2;--ember:#c2571d;--line:#e7e0d5}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Georgia,serif;background:var(--cream);color:var(--ink);padding:5vh 5vw 6vh}
  .wrap{max-width:760px;margin:0 auto}
  .mark{font-weight:bold;font-size:20px;margin-bottom:22px}
  .mark span{color:var(--ember)}
  h1{font-size:29px;margin-bottom:8px}
  .lede{font-family:Arial,Helvetica,sans-serif;font-size:15.5px;line-height:1.6;color:var(--soft);margin-bottom:22px;max-width:560px}
  .cal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:700px}
  .calendly-inline-widget{min-width:320px;height:720px}
  .foot{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;color:var(--soft);margin-top:26px}
  .foot a{color:var(--ember);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">Steel Rule<span>.</span></div>
  <h1>Grab a time with Nick</h1>
  <p class="lede">A 30 minute intro call, no prep needed on your end. Pick whatever works below and you will get a calendar invite with a video link right away. Weekends work too.</p>
  <div class="cal">
    <!-- Event details are shown again: Nick moved the call back to 30 minutes on
         9/4, so the event name, the real duration, and the page copy all agree
         now. It was hidden while the event said 30 but ran 15. -->
    <div class="calendly-inline-widget"
         data-url="https://calendly.com/nsf34-cornell/30min?hide_gdpr_banner=1&primary_color=c2571d"></div>
  </div>
  <p class="foot">Steel Rule Studio &middot; <a href="https://steelrulestudio.com">steelrulestudio.com</a> &middot; questions? <a href="mailto:hello@steelrulestudio.com">hello@steelrulestudio.com</a></p>
</div>
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
</body>
</html>
